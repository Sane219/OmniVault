pre-commit:
  parallel: true
  commands:
    lint-python:
      glob: "**/*.py"
      run: uv run ruff check {staged_files}
    lint-frontend:
      glob: "apps/web/src/**/*.{js,ts,jsx,tsx}"
      run: cd apps/web && pnpm exec eslint "src/**/*.{js,ts,jsx,tsx}"
    lint-yaml:
      glob: "**/*.yml"
      run: python3 -c "import yaml; yaml.safe_load(open('{staged_files}'))" || echo "YAML validation skipped"
    lint-docker-compose:
      glob: "docker-compose.yml"
      run: docker compose config --quiet || echo "Docker Compose validation skipped"

pre-push:
  parallel: true
  commands:
    typecheck-frontend:
      glob: "apps/web/**/*.{ts,tsx}"
      run: cd apps/web && pnpm exec tsc --noEmit
    test-python-api:
      glob: "apps/api-core/**/*.py"
      run: cd apps/api-core && ENCRYPTION_KEY=QGQLFwZJhYSeyDG8sED8Wl80_RyIZpZ1nYmAE1M07Og= SUPABASE_JWT_SECRET=test-secret-for-unit-tests uv run pytest tests/ -q --tb=short
    test-python-worker:
      glob: "apps/worker-ai/**/*.py"
      run: cd apps/worker-ai && ENCRYPTION_KEY=QGQLFwZJhYSeyDG8sED8Wl80_RyIZpZ1nYmAE1M07Og= uv run pytest tests/ -q --tb=short
    test-frontend:
      glob: "apps/web/**/*.{ts,tsx}"
      run: cd apps/web && pnpm test
