pre-commit:
  parallel: true
  commands:
    lint-python:
      glob: "**/*.py"
      run: uv run ruff check {staged_files}
    lint-frontend:
      glob: "apps/web/src/**/*.{js,ts,jsx,tsx}"
      run: cd apps/web && pnpm exec eslint "src/**/*.{js,ts,jsx,tsx}"
    lint-yaml:
      glob: "**/*.yml"
      run: python3 -c "import yaml; yaml.safe_load(open('{staged_files}'))" || echo "YAML validation skipped"
    lint-docker-compose:
      glob: "docker-compose.yml"
      run: docker compose config --quiet || echo "Docker Compose validation skipped"

    # Uncomment when Dockerfiles exist:
    # lint-dockerfile:
    #   glob: "**/Dockerfile*"
    #   run: hadolint {staged_files}

    # Uncomment when shell scripts exist:
    # lint-shell:
    #   glob: "**/*.sh"
    #   run: shellcheck {staged_files}

    # Uncomment when infra-as-code files exist:
    # lint-iac:
    #   glob: "**/{terraform*,cloudformation*,*.cfn}"
    #   run: checkov -f {staged_files}

    # Uncomment to enable secret scanning:
    # scan-secrets:
    #   glob: "**"
    #   run: gitleaks detect --staged-from-git --verbose

pre-push:
  parallel: true
  commands:
    test-python:
      glob: "apps/api-core/**/*.py apps/worker-ai/**/*.py"
      run: uv run pytest
    test-frontend:
      glob: "apps/web/**/*.{js,ts,jsx,tsx}"
      run: cd apps/web && pnpm exec tsc --noEmit || true
