version: '3.8'

services:
  edgedb:
    image: edgedb/edgedb:latest
    environment:
      EDGEDB_SERVER_SECURITY: insecure_dev_mode
    ports:
      - "5656:5656"
    volumes:
      - edgedb_data:/var/lib/edgedb/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-core:
    build:
      context: ./apps/api-core
    ports:
      - "8080:8080"
    environment:
      - EDGEDB_DSN=edgedb://edgedb@edgedb:5656/edgedb
    depends_on:
      - edgedb
      - redis
    volumes:
      - ./apps/api-core:/app

  worker-ai:
    build:
      context: ./apps/worker-ai
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EDGEDB_DSN=edgedb://edgedb@edgedb:5656/edgedb
    depends_on:
      - redis
      - edgedb
    volumes:
      - ./apps/worker-ai:/app

volumes:
  edgedb_data:
  redis_data:
