name: Bug Report
description: Report a bug in OmniVault
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When I upload a PDF larger than 20MB, the progress bar freezes at 50% and never completes."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to Workspace
        2. Upload a 25MB PDF
        3. Wait for processing
        4. Progress bar freezes at 50%
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: "The PDF should process fully and the knowledge graph should appear."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, console logs, or screenshots if possible.
      placeholder: "Progress bar stuck at 50%. Console shows: TimeoutError: Hatchet task exceeded 120s."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of OmniVault is affected?
      multiple: true
      options:
        - Frontend (Next.js)
        - API Core (Robyn)
        - Worker AI (Hatchet)
        - PDF Viewer
        - Knowledge Graph
        - Chat / RAG
        - Authentication
        - Document Upload
        - Other

  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Browser, OS, and device (e.g. Chrome 125, macOS 14, M1 MacBook)"
      placeholder: "Chrome 125, Windows 11, Desktop"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste any relevant log output, stack traces, or screenshots.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How badly does this affect your usage?
      options:
        - Low (cosmetic / minor inconvenience)
        - Medium (feature partially broken, workaround exists)
        - High (feature completely broken, no workaround)
        - Critical (data loss, security issue, or app crash)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem (document size, API key type, etc.)
    validations:
      required: false
