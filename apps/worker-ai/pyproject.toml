[project]
name = "worker-ai"
version = "0.1.0"
description = "Hatchet AI Worker for OmniVault"
dependencies = [
    "hatchet-sdk",
    "python-dotenv>=1.2.2",
    "google-genai>=2.0.1",
    "pymupdf>=1.27.2.3",
    "supabase>=2.30.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest"
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker_ai"]
