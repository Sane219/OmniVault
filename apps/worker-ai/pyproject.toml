[project]
name = "worker-ai"
version = "0.1.0"
description = "Hatchet AI Worker for OmniVault"
dependencies = [
    "hatchet-sdk",
    "edgedb",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest"
]

[tool.hatch.build.targets.wheel]
packages = ["src/worker_ai"]
